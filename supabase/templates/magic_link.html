<!doctype html>
<html lang="en">
  <body style="font-family:Arial,sans-serif;color:#17231d;line-height:1.5;max-width:560px;margin:auto;padding:32px">
    <h1 style="font-size:24px">Sign in to Stakeout</h1>
    <p>Enter this six-digit code:</p>
    <p style="font-size:30px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
    <p>Or use the link below. You will review the request before it signs you in.</p>
    <p><a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#c9f45b;color:#17231d;padding:12px 18px;border-radius:8px;text-decoration:none;font-weight:bold">Review sign-in</a></p>
    <p>This code and link expire in 10 minutes and can only be used once. If you did not request this email, you can ignore it.</p>
  </body>
</html>
